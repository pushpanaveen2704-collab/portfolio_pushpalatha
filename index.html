<!DOCTYPE html>
<html lang="en">

<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form">
    <h2>Registration Form</h2>
    <br><br>
    <label>Name:</label>
    <input type="text" placeholder="Enter your name">
     <br><br>
    <label>Email:</label>
    <input type="email" placeholder="Enter your email">
     <br><br>
    <label>Password:</label>
    <input type="password" placeholder="Enter password">
     <br><br>
    <label>DOB:</label>
    <input type="date">
     <br><br>
    <label>Courses:</label>
    <input type="number" placeholder="Number of courses">
     <br><br>
    <label>Bill Receipt:</label>
    <input type="file">
     <br><br>
    <label>Gender:</label>
    <div class="option">
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </div>

    <label>Languages:</label>
    <div class="option">
        <input type="checkbox"> Java
        
        <input type="checkbox"> Python
        
        <input type="checkbox"> C
        
    </div>

    <label>Department:</label>
    <select>
        <option>Select Department </option> 

        <br><br>
        <option>CSE </option>
        <br><br>
        <option>ECE </option>
        <br><br>
        <option>EEE </option>
        <br><br>
        <option>MECH </option>
        <br><br>
    </select>

</div>
<h2>
    <link rel="stylesheet"href="style.css">
    colour :red;
    text-align:centre;
    margin-bottom:30px;
    font-size:34px;
</h2>

</body>
</html>

    
</body>
</html>
